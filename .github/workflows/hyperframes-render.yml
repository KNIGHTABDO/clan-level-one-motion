name: Render HyperFrames Video
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Lint HyperFrames composition
        working-directory: hyperframes
        run: |
          npx --yes hyperframes lint

      - name: Render HyperFrames Video to MP4
        working-directory: hyperframes
        run: |
          mkdir -p out
          npx --yes hyperframes render -o out/clan_level_one_hyperframes.mp4

      - name: Capture verification snapshot frames
        working-directory: hyperframes
        run: |
          npx --yes hyperframes snapshot --at 0.25,1.0,2.5,3.8,4.5

      - name: Upload Master Video
        uses: actions/upload-artifact@v4
        with:
          name: clan-level-one-hyperframes-mp4
          path: hyperframes/out/clan_level_one_hyperframes.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload Snapshot Frames
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-snapshot-frames
          path: hyperframes/snapshots/
          if-no-files-found: warn
          retention-days: 14
