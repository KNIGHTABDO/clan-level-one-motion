name: Render HyperFrames Video
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies (FFmpeg & Google Chrome)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg wget gnupg
          if ! command -v google-chrome &> /dev/null; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Verify HyperFrames composition
        working-directory: hyperframes
        run: |
          npx --yes hyperframes lint
          npx --yes hyperframes check

      - name: Render HyperFrames Video to MP4
        working-directory: hyperframes
        run: |
          mkdir -p out
          npx --yes hyperframes render -o out/clan_level_one_hyperframes.mp4

      - name: Capture verification snapshot frames
        working-directory: hyperframes
        run: |
          npx --yes hyperframes snapshot --at 0.25,1.0,2.5,3.8,4.5

      - name: Upload Master Video
        uses: actions/upload-artifact@v4
        with:
          name: clan-level-one-hyperframes-mp4
          path: hyperframes/out/clan_level_one_hyperframes.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload Snapshot Frames
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-snapshot-frames
          path: hyperframes/snapshots/
          if-no-files-found: warn
          retention-days: 14
